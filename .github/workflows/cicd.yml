name: CI/CD

on:
  push:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_DEFAULT_REGION: ap-northeast-1
      SPRING_PROFILES_ACTIVE: github-actions

    defaults:
      run:
        working-directory: backend/demo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # -------------------------
      # DynamoDB Local
      # -------------------------

      - name: Start DynamoDB Local]
        run: |
          docker run -d \
            --name dynamodb \
            -p 8000:8000 \
            amazon/dynamodb-local:latest

      - name: Wait for DynamoDB
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8000/shell/ > /dev/null; then
              echo "DynamoDB Local is ready"
              exit 0
            fi

            echo "Waiting for DynamoDB..."
            sleep 2
          done

          echo "DynamoDB Local failed to start"
          exit 1

      # -------------------------
      # DynamoDB table
      # -------------------------

      - name: Create DynamoDB table
        env:
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
        run: |
          aws dynamodb create-table \
            --table-name Todos \
            --attribute-definitions \
              AttributeName=id,AttributeType=S \
            --key-schema \
              AttributeName=id,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --endpoint-url http://localhost:8000 \
            --region ap-northeast-1

      - name: Check DynamoDB table
        env:
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
        run: |
          aws dynamodb list-tables \
            --endpoint-url http://localhost:8000 \
            --region ap-northeast-1

      # -------------------------
      # Test
      # -------------------------

      - name: Build JAR
        run: ./mvnw clean package

      # -------------------------
      # AWS OIDC
      # -------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # role-to-assume: ${{ secrets.AWS_ROLE_ARN }} 
          role-to-assume: arn:aws:iam::992382546260:role/github-actions-ecr-role
          aws-region: ap-northeast-1

      # -------------------------
      # ECR
      # -------------------------

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            -t docker-image:${{ github.sha }} \
            .

      - name: Tag Docker image
        run: |
          docker tag \
            docker-image:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/docker-image:${{ github.sha }}

      - name: Push to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/docker-image:${{ github.sha }}

      # -------------------------
      # Lambda
      # -------------------------

      - name: Update Lambda
        run: |
          aws lambda update-function-code \
            --function-name todo-api \
            --image-uri ${{ steps.login-ecr.outputs.registry }}/docker-image:${{ github.sha }}

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name todo-api